memory_limit = 512M
expose_php = off
variables_order = "EGPCS"

; Logo-/Datei-Uploads: App-Limit ist 5 MB (LogoUploadController::MAX_BYTES).
; Ohne diese Zeilen gilt der PHP-Default (2M/8M) und ein 5-MB-Upload bricht
; vor dem Controller mit 500 ab (KC-57). post_max_size >= upload_max_filesize.
upload_max_filesize = 6M
post_max_size = 8M

[Date]
date.timezone="Europe/Berlin"
